
name: Build Winlator USB APK

on:
  workflow_dispatch:
  push:
    branches:
      - usb-bridge-v01

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;24.0.8215888"

      - name: Download and install Gradle
        shell: bash
        run: |
          set -e

          curl -fL --retry 5 --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 600 \
            https://services.gradle.org/distributions/gradle-8.14.5-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.14.5/bin" >> "$GITHUB_PATH"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WINLATOR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > winlator-release.jks
          test -s winlator-release.jks

      - name: Check signing key
        shell: bash
        env:
          STORE_PASS: ${{ secrets.WINLATOR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WINLATOR_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$STORE_PASS" ]; then
            echo "::error::Store password secret is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Key alias secret is missing"
            exit 1
          fi

          if ! keytool -list \
            -storetype PKCS12 \
            -keystore winlator-release.jks \
            -storepass:env STORE_PASS \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::GitHub cannot unlock the keystore"
            exit 1
          fi

          echo "KEYSTORE VERIFIED"

      - name: Build signed release APK
        shell: bash
        env:
          WINLATOR_STORE_PASSWORD: ${{ secrets.WINLATOR_STORE_PASSWORD }}
          WINLATOR_KEY_ALIAS: ${{ secrets.WINLATOR_KEY_ALIAS }}
          WINLATOR_KEY_PASSWORD: ${{ secrets.WINLATOR_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Permanent-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
