
name: Build Winlator USB APK

on:
  workflow_dispatch:
  push:
    branches:
      - usb-bridge-v01

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip \
            -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;24.0.8215888"

      

      - name: Download and install Gradle
        shell: bash
        run: |
          set -e
          curl -fL --retry 5 --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 600 \
            https://services.gradle.org/distributions/gradle-8.14.5-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.14.5/bin" >> "$GITHUB_PATH"

      - - name: Build debug APK
  env:
    ANDROID_HOME: /home/runner/android-sdk
    ANDROID_SDK_ROOT: /home/runner/android-sdk
  run: gradle assembleDebug --stacktrace



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-USB-Bridge-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
